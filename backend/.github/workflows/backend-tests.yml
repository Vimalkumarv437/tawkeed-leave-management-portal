name: Backend Tests

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop


jobs:
  backend-tests:
    name: Backend Tests and Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_DB: ${{ vars.TEST_POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.TEST_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready
          -U ${{ vars.TEST_POSTGRES_USER }}
          -d ${{ vars.TEST_POSTGRES_DB }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      APP_NAME: ${{ vars.APP_NAME }}
      ENVIRONMENT: testing

      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      JWT_SECRET_KEY: ${{ secrets.TEST_JWT_SECRET_KEY }}
      JWT_ALGORITHM: ${{ vars.JWT_ALGORITHM }}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.JWT_ACCESS_TOKEN_EXPIRE_MINUTES }}

      FRONTEND_URL: ${{ vars.FRONTEND_URL }}

      MAX_LOGIN_ATTEMPTS: ${{ vars.MAX_LOGIN_ATTEMPTS }}
      LOGIN_LOCKOUT_MINUTES: ${{ vars.LOGIN_LOCKOUT_MINUTES }}

    steps:

      # -----------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------------
      # Python
      # -----------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt


      # -----------------------------------------------------------
      # Install dependencies
      # -----------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # -----------------------------------------------------------
      # Database migration
      # -----------------------------------------------------------

      - name: Run Alembic migrations
        run: alembic upgrade head


      # -----------------------------------------------------------
      # Tests + coverage
      # -----------------------------------------------------------

      - name: Run backend tests
        run: >
          pytest tests -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70


      # -----------------------------------------------------------
      # Upload coverage report
      # -----------------------------------------------------------

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml